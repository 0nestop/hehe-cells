<style>
/* Layout: one narrow column, lab-sheet style. Gridded tables with violet rules, numbers in mono, one filled "key" row per result. Plate maps shade conditions or cell lines on a violet ramp. */
:root{
  --bg:#fbf9fe; --fg:#1d1430; --muted:#6a5f80; --line:#ddd3ee; --line-strong:#3b2566;
  --field:#f3eefb; --tint:#ece4fa; --hi:#4a2a87; --hi-fg:#ffffff; --warn:#b42339; --ok:#1f7a4a; --due:#9a5b00;
  --g1:#efe8fb; --g2:#d9c9f4; --g3:#bba2ea; --g4:#9877da; --g5:#7550c2; --g6:#53309a; --wfg:#ffffff; --sel:#1d1430;
  --c-media:#d6336c; --c-treat:#6b3fc0; --c-harv:#2b8a3e; --c1:#f7b6cf; --c2:#ffcf9e; --c3:#f3dc80; --c4:#b7e3a8; --c5:#a7dcd6; --c6:#b3cdf5; --c-seed:#a86a00; --c-conf:#2f6db5; --yel:#f5c518; --yel-d:#c99a00; --mbody:#efe6ff; --blush:#ffb3c7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --fg:#ece6f7; --muted:#a69cbc; --line:#352b47; --line-strong:#b39ce6;
  --field:#1e1729; --tint:#2a2140; --hi:#b89cf2; --hi-fg:#1a1029; --warn:#ff8a9a; --ok:#6fd194; --due:#f0b45a;
  --g1:#2a2140; --g2:#3d2f5e; --g3:#55407f; --g4:#7258a6; --g5:#957ccb; --g6:#bba7ea; --wfg:#141019; --sel:#ffffff;
  --c-media:#ff8fb8; --c-treat:#c4a8ff; --c-harv:#69db7c; --c1:#8a3c5c; --c2:#8a5a2e; --c3:#7a6a24; --c4:#3f6e37; --c5:#2f6a64; --c6:#3a5a8a; --c-seed:#f2c14e; --c-conf:#8ab8ff; --yel:#f5c518; --yel-d:#f5c518; --mbody:#2e2347; --blush:#c46a86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --fg:#ece6f7; --muted:#a69cbc; --line:#352b47; --line-strong:#b39ce6;
  --field:#1e1729; --tint:#2a2140; --hi:#b89cf2; --hi-fg:#1a1029; --warn:#ff8a9a; --ok:#6fd194; --due:#f0b45a;
  --g1:#2a2140; --g2:#3d2f5e; --g3:#55407f; --g4:#7258a6; --g5:#957ccb; --g6:#bba7ea; --wfg:#141019; --sel:#ffffff;
  --c-media:#ff8fb8; --c-treat:#c4a8ff; --c-harv:#69db7c; --c1:#8a3c5c; --c2:#8a5a2e; --c3:#7a6a24; --c4:#3f6e37; --c5:#2f6a64; --c6:#3a5a8a; --c-seed:#f2c14e; --c-conf:#8ab8ff; --yel:#f5c518; --yel-d:#f5c518; --mbody:#2e2347; --blush:#c46a86; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:2px solid var(--hi);padding-bottom:8px}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em;color:var(--hi)}
#syncState{font-family:var(--mono);font-size:12px;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line-strong);margin:14px 0 18px}
nav button{font:500 13px var(--sans);padding:10px 2px;border:0;border-right:1px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer}
nav button:last-child{border-right:0}
nav button[aria-selected="true"]{background:var(--hi);color:var(--hi-fg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
section.tab{display:flex;flex-direction:column;gap:14px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0;font-weight:600}
h3{font-size:16px;margin:0;font-weight:600}
h4{font-size:14px;margin:0;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;flex:none;accent-color:var(--hi)}
input:not([type=checkbox]):not([type=radio]),select,textarea{font:500 16px var(--mono);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:0;padding:9px 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
input[type=text],textarea,select.txt{font-family:var(--sans)}
textarea{min-height:72px;resize:vertical}
.unit{display:flex}.unit input{border-right:0}.unit em{font:400 13px var(--mono);font-style:normal;padding:0 8px;display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);color:var(--muted);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line-strong)}
.seg button{flex:1;font:500 13px var(--sans);padding:8px 4px;border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--hi);color:var(--hi-fg)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{border:1px solid var(--line-strong);padding:7px 9px;text-align:left;vertical-align:top}
th{font-weight:500;font-size:13px;width:46%}
td{font-family:var(--mono);font-weight:600;font-size:14px;overflow-wrap:anywhere}
td small,th small{display:block;font-weight:400;color:var(--muted);font-size:12px}
tr.key td,tr.key th{background:var(--hi);color:var(--hi-fg)}
tr.key td small{color:inherit;opacity:.85}
tr.grp th{background:var(--tint);font-weight:600}
table.mini th,table.mini td{font-size:12px;width:auto;padding:5px 7px}
table.mini thead th{font-weight:600;background:var(--tint)}
table.mini td.tot{background:var(--tint)}
table.set td{padding:0}table.set td input:not([type=checkbox]){border:0;background:transparent;font-size:14px;padding:8px}
table.set th{width:auto}table.set td.c{text-align:center;vertical-align:middle;padding:6px}
table.rx td{padding:0;min-width:130px}table.rx td input,table.rx td select{border:0;background:transparent;font-size:13px;padding:7px}
table.rx th{width:auto;font-size:12px;min-width:90px}
.note{font-size:13px;color:var(--muted);margin:0}
.warn{color:var(--warn);font-size:13px;margin:0;font-weight:500}
.okc{color:var(--ok)}.warnc{color:var(--warn)}.duec{color:var(--due)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 13px var(--sans);padding:8px 12px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--hi);color:var(--hi-fg);border-color:var(--hi)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{opacity:.7}
.block{border:1px solid var(--line-strong);display:flex;flex-direction:column;gap:12px;padding:12px;min-width:0}
.block.thick{border-width:2px;border-color:var(--hi)}
.inner{border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tag{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line-strong);padding:1px 6px;white-space:nowrap}
.tag.inv{background:var(--hi);color:var(--hi-fg);border-color:var(--hi)}
.sub{font-size:13px;color:var(--muted)}
.pre{white-space:pre-wrap;font-size:14px;margin:0}
.copy{display:flex;gap:8px;align-items:stretch}
.copy code{flex:1;min-width:0;font:12px/1.5 var(--mono);background:var(--field);border:1px dashed var(--line);padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.list{display:flex;flex-direction:column;border:1px solid var(--line-strong)}
.li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .when{font:600 12px var(--mono);min-width:72px}
.li .what{flex:1;min-width:0}
.li .what small{display:block;color:var(--muted);font-size:12px}
.li.done .what{text-decoration:line-through;opacity:.55}
.empty{border:1px dashed var(--line-strong);padding:14px;display:flex;flex-direction:column;gap:10px}
.callout{border:2px solid var(--hi);background:var(--tint);padding:10px;display:flex;flex-direction:column;gap:10px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13px;color:var(--muted)}
.sect{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--hi);margin:2px 0 -4px}
/* compact culture rows */
.crows{display:flex;flex-direction:column;border:1px solid var(--line-strong)}
.crow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;row-gap:5px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);min-width:0}
.crows>*:first-child .crow,.crows>.crow:first-child{border-top:0}
.crow.sel{background:var(--tint)}
.crow .l2{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
.ic{width:28px;height:28px;flex:none;color:var(--hi)}
.crow .cm{min-width:0}
.crow .l1{font-size:14px;overflow-wrap:anywhere}
.crow .l1 b{font-family:var(--mono)}
.l1 .sep{color:var(--line-strong);margin:0 4px}.l1 b{font-family:var(--mono)}
.chip{font:500 11px var(--mono);padding:1px 6px;border:1px solid var(--line);background:var(--field);color:var(--fg);white-space:nowrap}
.chip.w{border-color:var(--warn);color:var(--warn)}.chip.d{border-color:var(--due);color:var(--due)}
.crow .acts{display:flex;gap:6px;align-items:center;flex:none}
select.menu{width:40px;padding:5px 4px;font:600 14px var(--sans);text-align:center;background:var(--bg);border:1px solid var(--line-strong);color:var(--fg);cursor:pointer;appearance:none;-webkit-appearance:none}
details.exp{border:1px solid var(--line-strong);padding:0}
details.exp>summary{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;row-gap:5px;align-items:center;padding:8px 10px;color:var(--fg);font-size:14px}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary .l2{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
details.exp>summary .car{font:600 12px var(--mono);color:var(--muted)}
details.exp[open]>summary .car{transform:rotate(90deg)}
details.exp .xin{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px}
/* plate map + palette */
.ped{display:grid;gap:10px;align-items:start}
.ped.side{grid-template-columns:minmax(0,1fr) 132px}
.plate{display:grid;gap:3px;min-width:0}
.plate .hd{font:600 11px var(--mono);color:var(--muted);text-align:center;align-self:center;cursor:pointer;padding:2px 0;border:0;background:none}
.well{aspect-ratio:1;border:1px solid var(--line-strong);border-radius:50%;font:600 10px var(--mono);color:var(--fg);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;min-width:0}
.plate.ed .well{cursor:pointer}
.well.s{outline:3px solid var(--sel);outline-offset:1px}
[data-sh="1"]{--sh:var(--g1)}[data-sh="2"]{--sh:var(--g2)}[data-sh="3"]{--sh:var(--g3)}[data-sh="4"]{--sh:var(--g4)}[data-sh="5"]{--sh:var(--g5)}[data-sh="6"]{--sh:var(--g6)}
.well[data-sh]:not([data-sh="0"]){background:var(--sh)}
.well[data-sh="4"],.well[data-sh="5"],.well[data-sh="6"]{color:var(--wfg)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line-strong);vertical-align:-1px;margin-right:5px;background:var(--sh,var(--bg));flex:none}
.plate.p96 .well{font-size:8px}
.pal{display:flex;flex-direction:column;gap:6px;min-width:0}
.pal .pi{display:flex;gap:4px;align-items:stretch}
.pal .pb{flex:1;min-width:0;text-align:left;font:500 12px var(--sans);padding:6px 7px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:4px;overflow:hidden}
.pal .pb span.n{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.pal .pb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .pe{border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12px;padding:0 6px;cursor:pointer}
.pal input{font-size:12px!important;padding:5px 6px!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(20,10,40,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--bg);color:var(--fg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-top:3px solid var(--hi);
  padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--hi);color:var(--hi-fg);padding:10px 14px;font-size:14px;z-index:30;max-width:90%}
.well i{display:block;font-style:normal;font-size:.78em;opacity:.8;line-height:1}
.well{flex-direction:column;line-height:1.05}
.mini-seg button{font-size:11px;padding:5px 2px}
details.over{border:1px solid var(--warn);padding:8px 10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));border:1px solid var(--line-strong);min-width:588px}
.day{border-left:1px solid var(--line);min-height:120px;display:flex;flex-direction:column;gap:4px;padding:6px;min-width:0}
.day:first-child{border-left:0}.day.td{background:var(--tint)}.day.past{opacity:.6}
.dh{font:600 11px var(--mono);color:var(--muted);display:flex;justify-content:space-between}.day.td .dh{color:var(--hi)}
.ev{font-size:11px;border:1px solid var(--line);background:var(--bg);padding:3px 5px;line-height:1.25;overflow-wrap:anywhere}
.ev b{font-weight:600}.ev small{display:block;color:var(--muted);font-size:10px}
.ev.rem{border-color:var(--hi)}.ev.seed{background:var(--field);border-style:dashed;border-color:var(--hi)}.ev.conf{border-style:dashed}.ev.proj{border-style:dashed}.ev.plan{border-style:dashed}
.cstack{display:flex;flex-direction:column;gap:10px}
.tl{min-width:420px;display:flex;flex-direction:column;gap:2px}
.lane{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:6px}
.ln{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{position:relative;height:24px;border-bottom:1px solid var(--line)}
.tr.ax{height:30px;border-bottom:1px solid var(--line-strong)}
.tk{position:absolute;top:0;transform:translateX(-50%);font:600 11px var(--mono);color:var(--muted);text-align:center;line-height:1.1}
.tk small{display:block;font-size:9px;font-weight:400}
.mk{position:absolute;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);border:1.5px solid var(--hi);background:var(--bg)}
.mk.seed{border-radius:50%}
.mk.treat{background:var(--hi);width:10px;height:10px;transform:translate(-50%,-50%) rotate(45deg)}
.mk.harv{background:var(--fg);border-color:var(--fg)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--warn)}
.legend .mk.st,.legend .now.st{position:relative;display:inline-block;top:0;transform:none;vertical-align:-1px;margin-right:5px}
.legend .mk.treat.st{transform:rotate(45deg)}.legend .now.st{height:12px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:56px;height:56px;object-fit:cover;border:1px solid var(--line-strong);cursor:pointer;background:var(--field)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gal figure{margin:0;display:flex;flex-direction:column;gap:4px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line-strong);background:var(--field)}
.gal figcaption{font-size:12px;color:var(--muted)}
.well{position:relative;overflow:visible}
.well sup{position:absolute;top:-5px;right:-5px;font:700 9px var(--mono);background:var(--due);color:#fff;border-radius:7px;padding:0 4px;line-height:1.4;z-index:1}
.well.mkd{border:2px dashed var(--due)}
.ctag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--sh,var(--field));color:var(--fg);border:1px solid var(--line)}
.ctag[data-sh="4"],.ctag[data-sh="5"],.ctag[data-sh="6"]{color:var(--wfg)}
.ltag{font-size:12px;padding:1px 7px;border:2px dashed var(--due);border-radius:10px}
.ltag b{color:var(--due)}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rcard{border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px}
.rcard .unit select{border:1px solid var(--line);background:var(--bg);font:400 13px var(--mono);padding:0 4px;width:auto;min-width:78px;flex:none}.rcard .unit input{flex:1}
.ovr{border-top:1px solid var(--line);padding-top:6px;margin-top:6px;display:flex;flex-direction:column;gap:6px}
table.rx2 th{width:auto}table.rx2 tr.tsum th,table.rx2 tr.tsum td{background:var(--tint);font-weight:700}
.tk.gap{color:var(--line-strong)}.gp{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px)}
.tdrow{gap:8px}.tdbtn{flex:1;min-width:0;display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.tdbtn .car,details.tgrp .car{font:600 12px var(--mono);color:var(--muted)}
details.tgrp{border:0;border-top:1px solid var(--line);padding:0}details.tgrp:first-child{border-top:0}
details.tgrp>summary{display:flex;gap:10px;align-items:center;padding:9px 10px 9px 40px;color:var(--fg);font-size:15px;list-style:none}
details.tgrp>summary::-webkit-details-marker{display:none}details.tgrp>summary .when{font:600 12px var(--mono);min-width:72px}
details.tgrp>summary .what{flex:1}details.tgrp>summary .what small{display:block;color:var(--muted);font-size:12px}
details.tgrp .list{margin:0 8px 8px 24px}
button.ev{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;font-size:11px;color:var(--fg)}
details.ovw{border:1px solid var(--line-strong);padding:8px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand h1{line-height:1.1}.brand #greet{font-size:12px;display:block}
.top{align-items:center!important}.tr2{display:flex;align-items:center;gap:8px}
@media (max-width:520px){#syncState{display:none}}

function lineStats(L){
  const recs=(L&&L.records)||[];
  const td=recs.filter(r=>r.seeded>0&&r.harvested>r.seeded&&r.hours>0).map(r=>r.hours*Math.LN2/Math.log(r.harvested/r.seeded));
  const cd=recs.filter(r=>r.pct>=50&&r.area>0&&r.harvested>0).map(r=>r.harvested/(r.pct/100)/r.area);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
  const tdM=L&&num(L.tdManual)>0,cdM=L&&num(L.confCells)>0&&L.confVessel;
  return{td:tdM?num(L.tdManual):avg(td),tdSrc:tdM?"set by you":td.length?`learned from ${td.length} passage${td.length>1?"s":""}`:"",
    cd:cdM?num(L.confCells)/V(L.confVessel).a:avg(cd),cdSrc:cdM?"set by you":cd.length?`learned from ${cd.length} passage${cd.length>1?"s":""}`:""}
}
const cArea=C=>num(C.area)>0?num(C.area):V(C.vessel).a;
function confNow(C,at=Date.now()){const L=S.lines[C.lineId];if(!L||!(C.seeded>0)||C.status!=="active")return NaN;const s=lineStats(L);
  if(!(s.td>0&&s.cd>0))return NaN;return Math.min(100,C.seeded*Math.pow(2,(at-C.seededAt)/H/s.td)/(s.cd*cArea(C))*100)}
function confAt(C,pct){const L=S.lines[C.lineId];if(!L||!(C.seeded>0))return null;const s=lineStats(L);if(!(s.td>0&&s.cd>0))return null;
  const tgt=pct/100*s.cd*cArea(C);if(C.seeded>=tgt)return C.seededAt;return C.seededAt+s.td*Math.log2(tgt/C.seeded)*H}
function nextMedia(C){const e=num(C.mediaEvery);if(!(e>0)||C.status!=="active")return null;let t=(C.lastMedia||C.seededAt)+e*DAY;
  if(S.settings.skipWeekends){const d=new Date(t).getDay();if(d===6)t-=DAY;else if(d===0)t+=DAY}return t}

function cName(C){const L=S.lines[C.lineId];return C.label||`${L?L.name:"Culture"} ${pTxt(C)} ${C.vessel}`}

    r.log=`${it.fmt} ×${n} @ ${cells(per)} each → ${vol(r.susp)} susp${spin?`, resuspend ${vol(med)}`:` + ${vol(med-r.susp)} medium`}`}

      r.rows.push([`${L?esc(L.name):"No cell line"}<small>${m.n} wells${m.pl.size>1?` over ${m.pl.size} plates`:""} @ ${cells(m.c)}</small>`,`${vol(s)} suspension<small>+ ${md>=s?vol(md-s):"—"} medium (${vol(m.v)}/well)</small>`,0])});

function events(end){const now=Date.now(),items=[],tgt=S.settings.targetConf||90;

    const nm=nextMedia(C),e=num(C.mediaEvery);

    const ta=C.status==="active"&&!C.layout?confAt(C,tgt):null;if(ta&&ta>=sod(now))items.push({d:ta,kind:`~${tgt}% confluent`,c:C,type:"conf"});

    if(m.length!==1||!f.length||f.length>2){toast("Pick 1 male and 1–2 females.");return}
    const young=L.find(x=>mAge(s,x)<42);if(young){toast(`#${young.id} is only P${mAge(s,young)}. Breeders should be ~6 weeks (P42).`);return}
    if(!mMove(s,L.map(x=>x.id),"new"))return;s.log.unshift(`Paired ${L.map(x=>"#"+x.id).join(", ")}. Expect pups in ~3 weeks.`);MSEL.clear();save2();return}
  if(t.closest("[data-mgeno]")){const small=L.find(x=>mAge(s,x)<10);if(small){toast(`#${small.id} is P${mAge(s,small)}, too small to ear-punch. Wait until ~P10.`);return}
    const todo=L.filter(x=>!x.gt);if(!todo.length){toast("Already genotyped.");return}todo.forEach(x=>x.gt=s.day+2);
    s.log.unshift(`Ear-punched ${todo.map(x=>"#"+x.id).join(", ")}. PCR results in 2 days.`);MSEL.clear();save2();return}
  if(t.closest("[data-msend]")){const u=L.find(x=>x.gt!=="known");if(u){toast(`Genotype #${u.id} first. You need to know what you're using.`);return}const y=L.find(x=>mAge(s,x)<42);if(y){toast(`#${y.id} is P${mAge(s,y)}. Wait until P42.`);return}
    L.forEach(x=>{s.sent[["wt","het","ko"][x.g]]++});s.mice=s.mice.filter(x=>!MSEL.has(x.id));s.log.unshift(`Sent ${L.length} to your experiment ✦`);MSEL.clear();tidy(s);save2();return}
  if(t.closest("[data-mcull]")){s.mice=s.mice.filter(x=>!MSEL.has(x.id));s.log.unshift(`Retired ${L.length} ${L.length>1?"mice":"mouse"}. Thank you for your service.`);MSEL.clear();tidy(s);save2();return}}

function gelBlot(b){const W=300,H=170,lanes=6,lx=i=>62+i*38,mw=k=>20+Math.log(250/k)/Math.log(250/10)*(H-36),bgv=b.bg||.04,amp=b.amp==null?1:b.amp,ink=a=>`rgba(20,16,30,${Math.max(0,Math.min(1,a))})`,R=(()=>{let s=7;return()=>(s=(s*9301+49297)%233280)/233280})();
  let o=`<rect x="0" y="0" width="${W}" height="${H}" rx="6" fill="#eceae4"/><rect x="0" y="0" width="${W}" height="${H}" rx="6" fill="${ink(bgv)}"/>`;
  if(!b.noLadder)[250,130,100,70,55,35,25,15].forEach((k,i)=>{const y=mw(k);o+=`<rect x="22" y="${y-1.5}" width="24" height="3" rx="1" fill="${["#3b5bdb","#c92a2a","#3b5bdb","#e67700","#3b5bdb","#3b5bdb","#2b8a3e","#3b5bdb"][i]}" opacity=".85"/><text x="3" y="${y+3}" font-size="7" fill="#555">${k}</text>`});
  for(let i=0;i<lanes;i++){const x=lx(i),sm=b.smile?-b.smile*Math.pow((i-(lanes-1)/2)/((lanes-1)/2),2):0,y=mw(55)+sm,a=amp*(b.uneven?[1,.35,.8,.5,1,.6][i]:1)*(b.fat?1:.85);
    if(b.streak)o+=`<rect x="${x}" y="${y-4}" width="26" height="${H-y-6}" fill="url(#stk)" opacity="${.5+.4*R()}"/>`;
    if(a>0){if(b.ghost)o+=`<rect x="${x}" y="${y-5}" width="26" height="10" rx="3" fill="#f3f1ec" stroke="${ink(.9)}" stroke-width="2.5"/>`;
      else if(b.fat)o+=`<ellipse cx="${x+13}" cy="${y}" rx="18" ry="9" fill="${ink(.95)}" filter="url(#bl)"/>`;
      else o+=b.smile?`<path d="M${x} ${y-3}q13 ${b.smile*.35} 26 0v6q-13 ${b.smile*.35} -26 0z" fill="${ink(a)}" filter="url(#bl1)"/>`:`<rect x="${x}" y="${y-3}" width="26" height="6" rx="2" fill="${ink(a)}" filter="url(#bl1)"/>`;
      if(b.degr)[35,25,18].forEach((k,j)=>{o+=`<rect x="${x+1}" y="${mw(k)-2}" width="24" height="4" rx="2" fill="${ink(a*(.55-j*.15))}" filter="url(#bl1)"/>`})}}
  if(b.speck)for(let k=0;k<45;k++)o+=`<circle cx="${(10+R()*280).toFixed(1)}" cy="${(8+R()*152).toFixed(1)}" r="${(0.6+R()*1.6).toFixed(1)}" fill="${ink(.85)}"/>`;
  if(b.bubbles)[[95,80,11],[180,110,8],[230,60,13],[140,130,6]].forEach(([cx,cy,r])=>{o+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f6f5f1"/>`});
  const lc=[...Array(lanes)].map((_,i)=>{const a=b.uneven?[1,.35,.8,.5,1,.6][i]:1;return`<rect x="${lx(i)}" y="11" width="26" height="6" rx="2" fill="${ink(.8*a*(b.amp===0&&!b.noLadder?1:b.noLadder?0:1))}" filter="url(#bl1)"/>`}).join("");
  return`<svg viewBox="0 0 ${W} ${H+42}" width="100%" style="max-width:340px" role="img" aria-label="Western blot to diagnose"><defs><filter id="bl1"><feGaussianBlur stdDeviation=".8"/></filter><filter id="bl"><feGaussianBlur stdDeviation="2.5"/></filter>
    <linearGradient id="stk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(20,16,30,.7)"/><stop offset="1" stop-color="rgba(20,16,30,0)"/></linearGradient></defs>
    <text x="${W/2}" y="9" font-size="8" text-anchor="middle" fill="currentColor">Target (~55 kDa) · lanes 1–6</text><g transform="translate(0,12)">${o}</g>
    <g transform="translate(0,${H+14})"><rect x="0" y="0" width="${W}" height="26" rx="5" fill="#eceae4"/><text x="4" y="16" font-size="7" fill="#555">β-actin</text>${lc}</g></svg>`}
function gelHTML(){const sc=gget("gel_sc",{ok:0,n:0,seen:[]});let pool=GCASES.filter(c=>!(sc.seen||[]).includes(c.id));if(!pool.length){pool=GCASES;sc.seen=[]}
  const c=pool[Math.floor(Math.random()*pool.length)],opts=[c.ans,...c.wrong].sort(()=>Math.random()-.5);GTH={c,opts,done:false};gset("gel_sc",sc);

  f.querySelector(".pface").innerHTML=blessFace(ok?"^":"T");
